    if (!stored || typeof stored.id !== "string" || !/^[a-z0-9][a-z0-9-]{0,47}$/.test(stored.id)) return;
    if (stored.id === "standard") return;
    var revision = typeof stored.revision === "string" ? stored.revision : "";

    root.setAttribute("data-ui-theme", stored.id);

    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.setAttribute("blocking", "render");
    link.setAttribute("data-workspace-theme", stored.id);
    link.href = "/studio-static/_static/themes/" + encodeURIComponent(stored.id) + "/theme.css" +
      (revision ? "?v=" + encodeURIComponent(revision) : "");
    link.onerror = function () { link.remove(); };
    document.head.appendChild(link);
